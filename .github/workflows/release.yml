name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJ_USERNAME: RiddleMajor
  PROJ_NAME: No_Time_To_Waste

jobs:
  release:
    name: Create Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Build Mod
        run: dotnet build -c Release

      - name: Zip For Release
        run: 7z a ${{ env.PROJ_USERNAME }}.${{ env.PROJ_NAME }}.zip ./bin/Release/**

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.PROJ_USERNAME }}.${{ env.PROJ_NAME }}.zip"
          tag: v0.1.0
          name: "Version 0.1.0"
          draft: false
